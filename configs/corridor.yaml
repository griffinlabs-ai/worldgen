# 0.85, raised from 0.65 (AUT-222). Entering a cubicle from a room is a turn-in, so it is
# bounded by the CORNER frontier, not the gate frontier. Measured on the 1.10 x 0.47 m TCR
# robot (BENCHMARK_FINDINGS.md §9b): corner 0.78 -> 53.3% pass, 0.81 -> 100%. At 0.65 the
# robot cannot enter at all, which would have made every toilet unreachable and any
# "reach each fixture" metric a measurement of an impossible task.
#
# 0.85 sits above the 0.81 fully-passing arm with margin, and deliberately below the 0.90 m
# room gates so cubicle entry stays the tightest opening in the world -- the thing a tuning
# study should be stressed against. Upper bound is cubicle_door_width + wall_thickness <=
# 1.5 (toilet cubicle pitch), i.e. 1.35 here, so there is headroom if it needs to go wider.
cubicle_door_width: 0.85
